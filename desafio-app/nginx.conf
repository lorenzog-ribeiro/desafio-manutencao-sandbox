server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy para os endpoints da API Backend .NET
    location ~ ^/(health|jobs|events|webhooks|github) {
        proxy_pass http://api:5012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Endpoint /issues: se for navegação HTML no navegador (F5/SPA), serve index.html; se for API, passa ao backend
    location ~ ^/issues {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html break;
        }

        proxy_pass http://api:5012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Servir arquivos estáticos do Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Otimização de Cache e Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
}
